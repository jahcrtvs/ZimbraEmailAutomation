# Builds the Windows installer and attaches it to a GitHub Release whenever a version tag is pushed.
# Usage: npm run release:patch|minor|major, then git push --follow-tags
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Build installer
        run: |
          npm run build
          npx electron-builder --win --publish never

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          name: Daily Digest ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.exe
