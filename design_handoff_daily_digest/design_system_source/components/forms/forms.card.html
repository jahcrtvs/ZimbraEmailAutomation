<!-- @dsCard group="Components" viewport="700x360" name="Forms — Input, Textarea, Select, Date/Time pickers, toggles" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/lucide@0.454.0/dist/umd/lucide.min.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px;box-sizing:border-box}.r{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}</style></head><body><div id="root" style="position:relative"></div>
<script type="text/babel">
const DS=window.ZimbraDigestDesignSystem_9514e4;
const {Input,Textarea,Select,DatePicker,TimePicker,Switch,Checkbox,RadioCard}=DS;
function Demo(){const [d,setD]=React.useState(new Date(2026,9,8));const [t,setT]=React.useState("5:00 PM");const [m,setM]=React.useState("prepare");const [s,setS]=React.useState(true);const [c,setC]=React.useState(true);
return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14}}>
<Input label="Default recipient" defaultValue="manager@company.com"/>
<Input label="Zimbra URL" defaultValue="https://mail.company" error="Couldn't reach this address."/>
<DatePicker label="Send date" value={d} onChange={setD}/>
<TimePicker label="Send time" value={t} onChange={setT}/>
<Textarea label="Blockers" hint="Optional" rows={2} placeholder="Anything blocking your progress?"/>
<div style={{display:"flex",flexDirection:"column",gap:14}}><Select label="Model" value="flash" options={[{value:"flash",label:"Gemini 2.5 Flash"},{value:"pro",label:"Gemini 2.5 Pro"}]}/><Input label="Role" defaultValue="CDP Trainee" disabled/></div>
<RadioCard checked={m==="prepare"} onChange={()=>setM("prepare")} title="Prepare email in Zimbra" badge="Recommended" description="You review and press Send yourself."/>
<RadioCard tone="warning" checked={m==="auto"} onChange={()=>setM("auto")} title="Automatically send email" badge="Advanced" description="Sends at the scheduled time without confirmation."/>
<div style={{display:"flex",gap:24}}><Switch checked={s} onChange={setS} label="Show shortcuts"/><Checkbox checked={c} onChange={setC} label="Include blockers"/></div>
</div>}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
