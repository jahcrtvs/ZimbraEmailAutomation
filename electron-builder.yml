appId: com.dailydigest.app
productName: Daily Digest
directories:
  output: dist
files:
  - out/**
  - package.json
win:
  target:
    - target: nsis
      arch: [x64]
  # build/icon.png is the app icon; editing the executable is what puts it on Daily Digest.exe and its shortcuts.
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createStartMenuShortcut: true
  createDesktopShortcut: false
  shortcutName: Daily Digest
